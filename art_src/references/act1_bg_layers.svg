<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="sans-serif">
  <title>1막 도깨비 시장 배경 레이어 구성도</title>
  <desc>docs/DESIGN_ACT1.md 2.3절 참고 도식. 5레이어 구성, 스크롤 계수, 명도 위계. 최종 에셋이 아니라 구도 참조용.</desc>

  <rect x="0" y="0" width="960" height="620" fill="#12121c"/>
  <text x="24" y="36" fill="#f0e2c8" font-size="20" font-weight="bold">1막 도깨비 시장 - 배경 레이어 구성 (참조 도식, 최종 에셋 아님)</text>
  <text x="24" y="58" fill="#8a86a0" font-size="13">docs/DESIGN_ACT1.md 2.3절 / 스크롤 계수와 명도는 초안, M2 카메라 구현에서 확정</text>

  <!-- ===== 좌: 합성 예시 화면 ===== -->
  <text x="24" y="92" fill="#c8bfa0" font-size="14" font-weight="bold">합성 예시 (1화면)</text>
  <g>
    <rect x="24" y="104" width="520" height="292" fill="#1b1b30" stroke="#3a3a58"/>

    <!-- L0 하늘 -->
    <rect x="24" y="104" width="520" height="292" fill="#1d1b38"/>
    <circle cx="452" cy="152" r="26" fill="#f5e6b8" opacity="0.85"/>
    <circle cx="452" cy="152" r="42" fill="#f5e6b8" opacity="0.10"/>
    <circle cx="120" cy="140" r="1.6" fill="#e8e2ff" opacity="0.6"/>
    <circle cx="200" cy="128" r="1.4" fill="#e8e2ff" opacity="0.5"/>
    <circle cx="320" cy="146" r="1.4" fill="#e8e2ff" opacity="0.5"/>

    <!-- L1 원경 실루엣 -->
    <path d="M24 236 L96 210 L168 232 L232 206 L300 230 L372 208 L444 234 L544 214 L544 260 L24 260 Z" fill="#221f42"/>
    <path d="M60 236 l30 -14 l30 14 z" fill="#1a1832"/>
    <path d="M250 232 l34 -16 l34 16 z" fill="#1a1832"/>

    <!-- L2 중경 -->
    <rect x="24" y="258" width="520" height="52" fill="#2b2450"/>
    <g fill="#3a2f5e">
      <rect x="52" y="272" width="60" height="38"/>
      <rect x="140" y="266" width="72" height="44"/>
      <rect x="238" y="274" width="56" height="36"/>
      <rect x="322" y="268" width="80" height="42"/>
      <rect x="430" y="274" width="66" height="36"/>
    </g>
    <g fill="#e8973a" opacity="0.9">
      <circle cx="74" cy="268" r="3"/><circle cx="124" cy="264" r="3"/><circle cx="176" cy="262" r="3"/>
      <circle cx="228" cy="266" r="3"/><circle cx="280" cy="264" r="3"/><circle cx="336" cy="262" r="3"/>
      <circle cx="392" cy="266" r="3"/><circle cx="448" cy="264" r="3"/><circle cx="498" cy="268" r="3"/>
    </g>
    <path d="M40 268 Q160 254 280 266 Q400 254 528 268" stroke="#5b4a2e" stroke-width="1.5" fill="none"/>
    <g fill="#2f2a4a" opacity="0.9">
      <rect x="96" y="292" width="7" height="18"/><rect x="112" y="294" width="6" height="16"/>
      <rect x="268" y="292" width="7" height="18"/><rect x="352" y="294" width="6" height="16"/>
      <rect x="440" y="292" width="7" height="18"/>
    </g>

    <!-- L3 근경: 플레이 지형 -->
    <rect x="24" y="336" width="520" height="60" fill="#4a3a28"/>
    <rect x="24" y="330" width="520" height="8" fill="#6b5334"/>
    <!-- 등불 빛무리 -->
    <g fill="#f0a44a" opacity="0.13">
      <ellipse cx="110" cy="336" rx="54" ry="16"/>
      <ellipse cx="250" cy="336" rx="54" ry="16"/>
      <ellipse cx="390" cy="336" rx="54" ry="16"/>
      <ellipse cx="500" cy="336" rx="46" ry="14"/>
    </g>
    <!-- 가판대 -->
    <g stroke="#8a6a3c" stroke-width="2" fill="none">
      <path d="M70 296 L150 296"/><path d="M70 296 L74 310"/><path d="M150 296 L146 310"/>
      <path d="M76 314 L144 314"/><path d="M78 314 L78 330"/><path d="M142 314 L142 330"/>
    </g>
    <!-- 씨름장 -->
    <path d="M212 330 Q288 316 364 330 L364 336 L212 336 Z" fill="#7d6741"/>
    <path d="M226 330 Q288 322 350 330" stroke="#a08657" stroke-width="2" fill="none"/>
    <rect x="216" y="292" width="3" height="38" fill="#6b5334"/>
    <rect x="358" y="292" width="3" height="38" fill="#6b5334"/>
    <!-- 주막 -->
    <g stroke="#8a6a3c" stroke-width="2" fill="none">
      <path d="M420 288 L516 288 L508 296 L428 296 Z" fill="#5d4a2c"/>
      <path d="M432 296 L432 330"/><path d="M504 296 L504 330"/>
      <path d="M436 316 L490 316"/>
    </g>
    <circle cx="452" cy="322" r="5" fill="#e8973a" opacity="0.8"/>
    <!-- 플레이어 기준 실루엣 -->
    <rect x="286" y="308" width="12" height="22" fill="#e8e2d0"/>
    <text x="302" y="326" fill="#e8e2d0" font-size="10">플레이어</text>

    <!-- L4 전경 -->
    <path d="M24 104 L24 132 L96 120 L24 104 Z" fill="#0e0c1a" opacity="0.85"/>
    <path d="M544 104 L544 138 L452 118 L544 104 Z" fill="#0e0c1a" opacity="0.85"/>
    <path d="M24 116 Q140 138 260 120 Q380 138 544 118" stroke="#3a2f1e" stroke-width="2" fill="none" opacity="0.8"/>
    <g fill="#f0a44a" opacity="0.55">
      <circle cx="96" cy="130" r="5"/><circle cx="200" cy="130" r="5"/><circle cx="330" cy="130" r="5"/><circle cx="440" cy="128" r="5"/>
    </g>
    <path d="M24 380 Q120 366 210 382 L210 396 L24 396 Z" fill="#0e0c1a" opacity="0.5"/>
  </g>
  <text x="24" y="414" fill="#8a86a0" font-size="11">주의: 이 예시는 비율과 명도 위계 확인용이다. 실제 아트는 픽셀아트 규격(ART_PIPELINE 2장)으로 제작한다</text>

  <!-- ===== 우: 레이어 분해 ===== -->
  <text x="576" y="92" fill="#c8bfa0" font-size="14" font-weight="bold">레이어 분해와 스크롤 계수</text>
  <g font-size="12">
    <!-- L4 -->
    <rect x="576" y="104" width="360" height="52" fill="#0e0c1a" stroke="#3a3a58"/>
    <text x="588" y="122" fill="#f0e2c8" font-weight="bold">L4 전경</text>
    <text x="588" y="138" fill="#8a86a0">스크롤 1.3 / 처마, 등불 줄, 연기 / 반투명 40% 이하</text>
    <text x="588" y="152" fill="#6f6a86">화면 상하단 20% 안쪽만. 중앙 가림 금지</text>

    <!-- L3 -->
    <rect x="576" y="164" width="360" height="66" fill="#4a3a28" stroke="#e8973a"/>
    <text x="588" y="182" fill="#fff3dc" font-weight="bold">L3 근경 (플레이 지형)</text>
    <text x="588" y="198" fill="#f0e2c8">스크롤 1.0 / 가판대, 씨름장, 노름판, 주막, 지붕, 골목 벽</text>
    <text x="588" y="212" fill="#f0d9b0">명도 최고, 대비 최고. 충돌 가능한 것은 전부 이 레이어에만</text>
    <text x="588" y="226" fill="#f0d9b0">상호작용 오브젝트는 밝은 아웃라인으로 장식과 구분</text>

    <!-- L2 -->
    <rect x="576" y="238" width="360" height="60" fill="#2b2450" stroke="#3a3a58"/>
    <text x="588" y="256" fill="#f0e2c8" font-weight="bold">L2 중경</text>
    <text x="588" y="272" fill="#8a86a0">스크롤 0.5 / 등불 줄, 천막 열, 간판, 손님 도깨비 실루엣</text>
    <text x="588" y="286" fill="#6f6a86">점광원 다수로 활기 담당. 발판처럼 보이는 수평 구조물 금지</text>

    <!-- L1 -->
    <rect x="576" y="306" width="360" height="52" fill="#221f42" stroke="#3a3a58"/>
    <text x="588" y="324" fill="#f0e2c8" font-weight="bold">L1 원경</text>
    <text x="588" y="340" fill="#8a86a0">스크롤 0.2 / 능선, 기와와 초가 실루엣 / 남색 2~3톤</text>
    <text x="588" y="354" fill="#6f6a86">디테일과 개별 창문 광원 금지</text>

    <!-- L0 -->
    <rect x="576" y="366" width="360" height="52" fill="#1d1b38" stroke="#3a3a58"/>
    <text x="588" y="384" fill="#f0e2c8" font-weight="bold">L0 하늘</text>
    <text x="588" y="400" fill="#8a86a0">스크롤 0.05 / 밤하늘, 큰 달(고정 광원), 옅은 구름</text>
    <text x="588" y="414" fill="#6f6a86">별의 강한 반짝임 금지</text>
  </g>

  <!-- ===== 하단: 색 채널 규약 ===== -->
  <text x="24" y="452" fill="#c8bfa0" font-size="14" font-weight="bold">색 채널 규약 (2.4절)</text>
  <g font-size="12">
    <rect x="24" y="464" width="140" height="44" fill="#e8973a"/>
    <text x="34" y="482" fill="#2b1a08" font-weight="bold">주황, 호박</text>
    <text x="34" y="498" fill="#2b1a08">등불. 배경의 주인</text>

    <rect x="176" y="464" width="140" height="44" fill="#2b2450"/>
    <text x="186" y="482" fill="#f0e2c8" font-weight="bold">남색, 보라</text>
    <text x="186" y="498" fill="#c8bfa0">밤 바탕, 그림자</text>

    <rect x="328" y="464" width="176" height="44" fill="#3fd0c0"/>
    <text x="338" y="482" fill="#08302b" font-weight="bold">청록 (배경 사용 금지)</text>
    <text x="338" y="498" fill="#08302b">도깨비불 = 발판과 비밀 신호</text>

    <rect x="516" y="464" width="176" height="44" fill="#d3453c"/>
    <text x="526" y="482" fill="#2b0806" font-weight="bold">적색 (배경 사용 금지)</text>
    <text x="526" y="498" fill="#2b0806">생기 몰림 광폭화 전용</text>

    <rect x="704" y="464" width="176" height="44" fill="#f4ecd6"/>
    <text x="714" y="482" fill="#2b2408" font-weight="bold">흰색, 옅은 금색</text>
    <text x="714" y="498" fill="#2b2408">상호작용 하이라이트</text>
  </g>

  <!-- ===== 하단: 테마별 변조 ===== -->
  <text x="24" y="542" fill="#c8bfa0" font-size="14" font-weight="bold">구간 테마별 조명 변조 (2.7절)</text>
  <g font-size="12">
    <rect x="24" y="554" width="280" height="48" fill="#3a2a18" stroke="#e8973a"/>
    <text x="34" y="572" fill="#f0e2c8" font-weight="bold">좌판 거리</text>
    <text x="34" y="588" fill="#c8bfa0">등불 밀도 최대, 빛무리 연속. 활기와 소음</text>

    <rect x="316" y="554" width="280" height="48" fill="#242a44" stroke="#7f9ad0"/>
    <text x="326" y="572" fill="#f0e2c8" font-weight="bold">지붕 위</text>
    <text x="326" y="588" fill="#c8bfa0">달빛 한색 우세, 등불은 아래에서. 고요와 개방</text>

    <rect x="608" y="554" width="280" height="48" fill="#181425" stroke="#3fd0c0"/>
    <text x="618" y="572" fill="#f0e2c8" font-weight="bold">골목</text>
    <text x="618" y="588" fill="#c8bfa0">저조도, 도깨비불 최다. 은밀과 압박</text>
  </g>
</svg>
